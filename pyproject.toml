[project]
name = "atdl-kd-ternary"
version = "0.1.0"
description = "CIFAR-10 ResNet34 teacher to ternary ResNet18 QAT research project"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "jupyterlab==4.6.3",
    "ipykernel==7.3.0",
    "matplotlib==3.11.1",
    "nbconvert==7.17.1",
    "nbformat==5.11.1",
    "numpy==2.5.2",
    "optuna==4.7.0",
    "scikit-learn==1.9.0",
    "tqdm==4.70.0",
    "PyYAML==6.0.3",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py313"
